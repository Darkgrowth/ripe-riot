name: Sunpatch gameplay proof

on:
  push:
    branches: [codex/sunpatch-chaos-combat]
    paths:
      - .github/workflows/sunpatch-gameplay-proof.yml
      - AGENTS.md
      - package.json
      - package-lock.json
      - src/**
      - tools/harness/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Harness-only fixes can reuse the unchanged source's expedition/rescue
        # evidence. Source changes use the full matrix.
        proof: >-
          ${{ fromJSON(startsWith(github.event.head_commit.message, 'test: orchard proof') && '["orchard-extraction","orchard-coop"]' || startsWith(github.event.head_commit.message, 'test: rescue proof') && '["snapjaw-coop","snapjaw-guest"]' || '["expedition","snapjaw-coop","snapjaw-guest","orchard-extraction","orchard-coop","scenarios"]') }}
    env:
      RIPE_URL: http://127.0.0.1:5278
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start isolated frozen build
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 5278 --strictPort > "$RUNNER_TEMP/ripe-preview.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$RIPE_URL" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ripe-preview.log"
          exit 1
      - name: Run normal-input gameplay proof
        shell: bash
        run: |
          if [ '${{ matrix.proof }}' = orchard-extraction ]; then
            xvfb-run -a node tools/harness/orchard-extraction-proof.mjs \
              --allow-browser-input --headed --logic-only --out capture/ci/orchard-extraction
          elif [ '${{ matrix.proof }}' = orchard-coop ]; then
            xvfb-run -a node tools/harness/orchard-extraction-proof.mjs \
              --allow-browser-input --headed --logic-only --coop --out capture/ci/orchard-coop
          elif [ '${{ matrix.proof }}' = expedition ]; then
            xvfb-run -a node tools/harness/sunpatch-expedition-playthrough.mjs \
              --allow-browser-input --width 1712 --height 634 --seconds 1800 \
              --headed --lean-proof --logic-only --out capture/ci/expedition
          elif [ '${{ matrix.proof }}' = snapjaw-coop ]; then
            node tools/harness/snapjaw-coop-proof.mjs \
              --allow-browser-input --logic-only --no-setup-shot --freeze-catch-frame \
              --out capture/ci/snapjaw-coop
          elif [ '${{ matrix.proof }}' = snapjaw-guest ]; then
            node tools/harness/snapjaw-coop-proof.mjs \
              --allow-browser-input --logic-only --no-setup-shot --freeze-catch-frame \
              --guest-rescuer --out capture/ci/snapjaw-guest
          else
            mkdir -p capture/ci/scenarios
            npm test 2>&1 | tee capture/ci/scenarios/scenarios.log
          fi
      - name: Keep server log with proof
        if: always()
        shell: bash
        run: |
          mkdir -p 'capture/ci/${{ matrix.proof }}'
          cp "$RUNNER_TEMP/ripe-preview.log" 'capture/ci/${{ matrix.proof }}/preview.log' || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sunpatch-${{ matrix.proof }}
          path: capture/ci/${{ matrix.proof }}/
          if-no-files-found: warn
          retention-days: 14
