name: Sunpatch gameplay proof

on:
  push:
    branches: [codex/sunpatch-chaos-combat]
    paths:
      - .github/workflows/sunpatch-gameplay-proof.yml
      - AGENTS.md
      - package.json
      - package-lock.json
      - src/**
      - tools/harness/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        proof: [expedition, snapjaw-coop]
    env:
      RIPE_URL: http://127.0.0.1:5278
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start isolated frozen build
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 5278 --strictPort > "$RUNNER_TEMP/ripe-preview.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$RIPE_URL" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ripe-preview.log"
          exit 1
      - name: Run normal-input gameplay proof
        shell: bash
        run: |
          if [ '${{ matrix.proof }}' = expedition ]; then
            node tools/harness/sunpatch-expedition-playthrough.mjs \
              --allow-browser-input --width 1712 --height 634 --seconds 1800 \
              --lean-proof --logic-only --out capture/ci/expedition
          else
            node tools/harness/snapjaw-coop-proof.mjs \
              --allow-browser-input --logic-only --no-setup-shot \
              --out capture/ci/snapjaw-coop
          fi
      - name: Keep server log with proof
        if: always()
        shell: bash
        run: |
          mkdir -p 'capture/ci/${{ matrix.proof }}'
          cp "$RUNNER_TEMP/ripe-preview.log" 'capture/ci/${{ matrix.proof }}/preview.log' || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sunpatch-${{ matrix.proof }}
          path: capture/ci/${{ matrix.proof }}/
          if-no-files-found: warn
          retention-days: 14
